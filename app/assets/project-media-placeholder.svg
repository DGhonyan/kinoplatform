<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cbClip">
      <rect x="24" y="44" width="112" height="20" rx="3"/>
    </clipPath>
  </defs>

  <!-- board -->
  <rect x="24" y="64" width="112" height="72" rx="6" fill="#151515"/>
  <!-- top cell row -->
  <rect x="32" y="72" width="96" height="16" rx="2" fill="#2b2b2b"/>
  <line x1="64" y1="72" x2="64" y2="88" stroke="#151515" stroke-width="3"/>
  <line x1="96" y1="72" x2="96" y2="88" stroke="#151515" stroke-width="3"/>
  <!-- slate lines -->
  <rect x="32" y="100" width="96" height="4" rx="2" fill="#ededed"/>
  <rect x="32" y="112" width="96" height="4" rx="2" fill="#ededed"/>
  <rect x="32" y="124" width="62" height="4" rx="2" fill="#ededed"/>

  <!-- clapper (hinged at left, tilted open) -->
  <g transform="rotate(-12 28 63)">
    <rect x="24" y="44" width="112" height="20" rx="3" fill="#151515"/>
    <g clip-path="url(#cbClip)" fill="#f0f0f0">
      <polygon points="24,64 35,44 46,44 35,64"/>
      <polygon points="46,64 57,44 68,44 57,64"/>
      <polygon points="68,64 79,44 90,44 79,64"/>
      <polygon points="90,64 101,44 112,44 101,64"/>
      <polygon points="112,64 123,44 134,44 123,64"/>
    </g>
  </g>

  <!-- hinge -->
  <circle cx="28" cy="63" r="4" fill="#8f8f8f"/>
</svg>
